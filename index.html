<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Abdulrahman Kamal — Computer Science Graduate & IT Professional based in Erbil, Kurdistan Region – Iraq. Portfolio and CV.">
  <meta name="author" content="Abdulrahman Kamal">
  <title>Abdulrahman Kamal — Portfolio</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ═══════════════════════════════════════════════════════════
       All content is rendered dynamically by app.js from JSON.
       These are structural shells only — no text is hardcoded.
       ═══════════════════════════════════════════════════════════ -->

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-portfolio fixed-top" id="main-nav" role="navigation" aria-label="Main navigation">
    <!-- Rendered by JS -->
  </nav>

  <div id="app">

    <!-- Hero -->
    <section class="hero" id="hero" aria-label="Introduction">
      <div id="hero-section"><!-- Rendered by JS --></div>
    </section>

    <!-- About -->
    <section class="section" id="about" aria-label="About">
      <div id="about-section"><!-- Rendered by JS --></div>
    </section>

    <!-- Experience -->
    <section class="section" id="experience" aria-label="Experience" style="background: rgba(255,255,255,0.35);">
      <div id="experience-section"><!-- Rendered by JS --></div>
    </section>

    <!-- Skills -->
    <section class="section" id="skills" aria-label="Skills">
      <div id="skills-section"><!-- Rendered by JS --></div>
    </section>

    <!-- Education & Languages -->
    <section class="section" id="education" aria-label="Education & Languages" style="background: rgba(255,255,255,0.35);">
      <div id="education-section"><!-- Rendered by JS --></div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact" aria-label="Contact">
      <div id="contact-section"><!-- Rendered by JS --></div>
    </section>

  </div>

  <!-- Footer -->
  <footer class="footer" id="footer" role="contentinfo">
    <!-- Rendered by JS -->
  </footer>

  <!-- Bootstrap 5 JS (bundle with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>

  <!-- Content Data -->
  <script src="data/content.js"></script>

  <!-- Portfolio Application -->
  <script src="js/app.js"></script>
</body>
</html>
